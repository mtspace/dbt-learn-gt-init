models:
  - name: stg_jaffle_shop__customers
    description: "Staging model for the customers table in the jaffle_shop schema."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique
      - name: first_name
        description: "First name of the customer."
      - name: last_name
        description: "Last name of the customer."
      - name: email
        description: "Email address of the customer."
      - name: created_at
        description: "Timestamp when the customer record was created."
  - name: stg_jaffle_shop__orders
    description: "Staging model for the orders table in the jaffle_shop schema."  
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Identifier for the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: "Date when the order was placed."
      - name: status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']